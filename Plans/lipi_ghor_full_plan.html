const root = document.getElementById('root');
data.forEach(task => {
  const div = document.createElement('div');
  div.className = `task ${task.pal}`;
  div.innerHTML = `
    <div class="task-head">
      <span class="tnum">${task.num}</span>
      <span class="ttitle">${task.title}</span>

      <div class="sec">Step-by-step execution</div>
